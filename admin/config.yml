backend:
  name: github
  repo: BethlehemUMC/growatbethlehem-website
  branch: main
  base_url: https://bethlehem-umc-cms-auth.growatbethlehem.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "index.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "about"
        label: "About Page"
        file: "about.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "newhere"
        label: "New Here? Page"
        file: "newhere.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "service"
        label: "Service Page"
        file: "service.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "give"
        label: "Give Page"
        file: "give.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "contact"
        label: "Contact Page"
        file: "contact.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

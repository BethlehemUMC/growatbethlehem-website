backend:
  name: github
  repo: BethlehemUMC/growatbethlehem-website
  branch: main
  base_url: https://bethlehem-umc-cms-auth.growatbethlehem.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website Pages"
    format: "frontmatter"
    files:
      - name: "home"
        label: "Home Page"
        file: "index.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - label: "Hero (top banner)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background Photo", name: "image", widget: "image" }
              - { label: "Photo Description (for accessibility)", name: "imageAlt", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonLink", widget: "string" }
              - { label: "Service Time Line 1", name: "serviceTime1", widget: "string" }
              - { label: "Service Time Line 2", name: "serviceTime2", widget: "string" }
          - label: '"New Here?" Section'
            name: "newHere"
            widget: "object"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo Description (for accessibility)", name: "imageAlt", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
              - { label: "Link Text", name: "linkText", widget: "string" }
          - label: "Worship Section"
            name: "worship"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo Description (for accessibility)", name: "imageAlt", widget: "string" }
          - label: '"We Are the Church" Section'
            name: "weAreChurch"
            widget: "object"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo Description (for accessibility)", name: "imageAlt", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Link Text", name: "linkText", widget: "string" }
          - label: "Giving Section"
            name: "giving"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Bible Verse", name: "verse", widget: "string" }
              - { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Link Text", name: "linkText", widget: "string" }
          - label: "Bottom Photo"
            name: "footerImage"
            widget: "object"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Photo Description (for accessibility)", name: "imageAlt", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "about.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "newhere"
        label: "New Here? Page"
        file: "newhere.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "service"
        label: "Service Page"
        file: "service.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "give"
        label: "Give Page"
        file: "give.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

      - name: "contact"
        label: "Contact Page"
        file: "contact.njk"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Description (for search engines)", name: "description", widget: "text" }
          - { label: "Page Content (HTML)", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }
